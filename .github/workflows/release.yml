name: Projekt Kanban Agent Manager Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Verify release version
        id: package
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing manager version $version"

      - name: Build Windows WSL bridge
        run: |
          x86_64-w64-mingw32-gcc \
            -std=c11 -O2 -Wall -Wextra -Werror -municode -static -s \
            -Wl,--no-insert-timestamp \
            -o native-host-windows-wsl/projekt-kanban-agent-wsl.exe \
            native-host-windows-wsl/wsl-relay.c

      - name: Run release checks
        run: |
          python3 -m py_compile native-host/kanban_agent_host.py
          python3 native-host/kanban_agent_host.py --self-test

      - name: Build Windows WSL release archive
        run: python3 scripts/build_release.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Projekt Kanban Agent Manager ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/projekt-kanban-agent-manager-${{ steps.package.outputs.version }}-windows-wsl.zip
            dist/SHA256SUMS
